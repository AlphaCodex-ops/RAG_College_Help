AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: CHAAMP - AI Smart Campus Assistant placeholder scaffold

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  KnowledgeBaseId:
    Type: String
    Default: REPLACE_WITH_KB_ID
  DataSourceId:
    Type: String
    Default: REPLACE_WITH_DS_ID
  ModelArn:
    Type: String
    Default: REPLACE_WITH_MODEL_ARN
  FrontendOrigins:
    Type: CommaDelimitedList
    Default: "http://localhost:5173"
  AlertEmail:
    Type: String
    Default: ""

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        STAGE: !Ref Stage
        LOG_LEVEL: INFO
        USERS_TABLE: !Ref UsersTable
        EVENTS_TABLE: !Ref EventsTable
        ANNOUNCEMENTS_TABLE: !Ref AnnouncementsTable
        COMPLAINTS_TABLE: !Ref ComplaintsTable
        DOCUMENTS_TABLE: !Ref DocumentsTable
        QUERYLOGS_TABLE: !Ref QueryLogsTable
        DOCS_BUCKET: !Ref DocsBucket
        KNOWLEDGE_BASE_ID: !Ref KnowledgeBaseId
        DATA_SOURCE_ID: !Ref DataSourceId
        MODEL_ARN: !Ref ModelArn

Resources:
  DocsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH

  AnnouncementsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: announcementId
          AttributeType: S
      KeySchema:
        - AttributeName: announcementId
          KeyType: HASH

  ComplaintsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: complaintId
          AttributeType: S
      KeySchema:
        - AttributeName: complaintId
          KeyType: HASH

  DocumentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: documentId
          AttributeType: S
      KeySchema:
        - AttributeName: documentId
          KeyType: HASH

  QueryLogsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: queryId
          AttributeType: S
      KeySchema:
        - AttributeName: queryId
          KeyType: HASH

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${Stage}-chaamp-users"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience: [!Ref UserPoolClient]

  AskFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Stage}-chaamp-ask"
      CodeUri: backend/functions/ask/
      Handler: app.handler
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref QueryLogsTable
        - Statement:
            - Effect: Allow
              Action: [bedrock:RetrieveAndGenerate, bedrock:Retrieve]
              Resource: !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${KnowledgeBaseId}"
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource: [!Ref ModelArn, !Sub "arn:aws:bedrock:*::foundation-model/*"]
      Events:
        Ask:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /ask
            Method: POST

Outputs:
  ApiUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  DocsBucketName:
    Value: !Ref DocsBucket
  Region:
    Value: !Ref "AWS::Region"
